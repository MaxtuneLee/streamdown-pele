name: Publish

on:
  release:
    types: [published]

# Publishes through npm trusted publishing (OIDC), so no npm token is stored.
# Register this repository and workflow file under the package's trusted publisher settings on npmjs.com.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5.1 or newer, which trusted publishing requires.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm --version
      - run: npm publish --provenance --access public
